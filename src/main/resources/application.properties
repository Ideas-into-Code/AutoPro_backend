# Application
spring.application.name=autopro-backend

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autopro}
spring.datasource.username=${DB_USERNAME:autopro_user}
spring.datasource.password=${DB_PASSWORD:autopro_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:Y2hhbmdlbWVpbnByb2R1Y3Rpb25jaGFuZ2VtZWlucHJvZHVjdGlvbg==}
jwt.expiration=${JWT_EXPIRATION:86400000}