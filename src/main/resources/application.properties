# Application
spring.application.name=autopro-backend

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autopro_db}
spring.datasource.username=${DB_USERNAME:autopro_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Server
server.port=${PORT:8080}

# JWT
# Pas de valeur par défaut : un secret par défaut committé dans le repo annule la sécurité du JWT.
# Générer une valeur avec: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary
# api-key et api-secret n'ont pas de valeur par défaut : ce sont des identifiants de compte réels,
# ils ne doivent jamais être committés en clair.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dasdoiboo}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File upload
upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:5242880}
upload.allowed-image-types=image/jpeg,image/png,image/webp
upload.allowed-document-types=application/pdf
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB