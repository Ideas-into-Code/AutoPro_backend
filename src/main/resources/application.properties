# Application
spring.application.name=autopro-backend

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autopro_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:Y2hhbmdlbWVpbnByb2R1Y3Rpb25jaGFuZ2VtZWlucHJvZHVjdGlvbg==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dasdoiboo}
cloudinary.api-key=${CLOUDINARY_API_KEY:324531823821837}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:o2lo4jnL3K9P5lbPzrL1EbHpCLQ}

# File upload
upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:5242880}
upload.allowed-image-types=image/jpeg,image/png,image/webp
upload.allowed-document-types=application/pdf
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB