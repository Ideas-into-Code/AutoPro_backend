# Test DataSource (H2 in-memory for unit tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (valeur factice réservée aux tests, ne pas réutiliser ailleurs)
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=
jwt.expiration=3600000

# Cloudinary (valeurs factices : aucun appel réseau réel n'est fait pendant les tests)
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

app.base-url=http://localhost:8080

# PayDunya (valeurs factices : PayDunyaClient est mocké dans les tests de service,
# ces valeurs ne servent qu'à permettre au contexte Spring de démarrer)
paydunya.base-url=https://app.paydunya.com/sandbox-api/v1
paydunya.master-key=test-master-key
paydunya.private-key=test-private-key
paydunya.public-key=test-public-key
paydunya.token=test-token
